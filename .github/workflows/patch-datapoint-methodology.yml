name: One-shot Datapoint methodology patch

on:
  push:
    branches: [feat/datapoint-sandbox-plumbing]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/datapoint-sandbox-plumbing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch methodology and docs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          old_pairwise = '''## Pairwise preference protocol

Annotators see:

- the original user instruction;
- two final images at equivalent display size;
- no controller, provider, or model identity;
- randomized left/right placement.

Question:

> Imagine that you submitted the request above. Which result would you prefer to receive overall? Consider whether it satisfies the requested content, composition, text, style, and other constraints, as well as overall visual quality.

Responses:

- Image A;
- Image B;
- Tie / no meaningful preference.
'''
          new_pairwise = '''## Pairwise preference protocol

Pairwise preference is a secondary endpoint. To guarantee that annotators see the exact task request using Datapoint's documented comparison contract, production pairwise collection creates **one Datapoint comparison job per benchmark task**. All predeclared A/B pairs for that benchmark task are batched as datapoints within the same job, and the exact original user instruction is embedded in the job-level instruction shown to annotators.

Annotators see:

- the exact original user instruction in the job-level question;
- two final images at equivalent native display treatment;
- no controller, provider, or model identity;
- randomized on-screen candidate order while A/B identity remains tied to submission order.

Question:

> Imagine that you submitted the request above. Which result would you prefer to receive overall? Consider whether it satisfies the requested content, composition, text, style, and other constraints, as well as overall visual quality.

Responses (**forced-choice A/B**):

- Image A;
- Image B.

Datapoint's native comparison task does not expose an individual no-preference/tie response. Thrumely therefore uses native forced choice rather than transforming candidate images into a composite multiple-choice artifact. This change affects only the secondary pairwise measure; the **primary 1–5 instruction-faithfulness endpoint is unchanged**.
'''
          replace_once('RESEARCH_SPEC.md', old_pairwise, new_pairwise)

          readme_cmd = "python -m pytest -q\npython -m thrumely.validate_candidates candidates/tasks-v0.1.jsonl"
          replace_once('README.md', readme_cmd, "python -m pytest -q\npython -m thrumely.datapoint_sandbox --offline\npython -m thrumely.validate_candidates candidates/tasks-v0.1.jsonl")

          datapoint_heading = '''## Datapoint grant

Human annotation for the planned core study is supported by a Datapoint Data Grant. **No Datapoint production annotation or paid Datapoint pilot is part of the current calibration stage.**
'''
          datapoint_replacement = '''## Datapoint sandbox integration

Thrumely now includes a dependency-free, sandbox-only Datapoint integration contract for the planned human evaluation. Normal CI runs `python -m thrumely.datapoint_sandbox --offline`, which uses a deterministic fake transport: it performs no network calls, reads no credentials, creates no real Datapoint jobs, and consumes zero credits.

The current platform contract is recorded in `docs/decisions/0002-datapoint-pairwise-forced-choice.md`. The primary 1–5 instruction-faithfulness rating uses Datapoint `rating` with `{context}` substitution. The secondary pairwise measure uses native forced-choice `comparison`; because Datapoint only guarantees the job-level comparison instruction is visible, Thrumely plans one comparison job per frozen benchmark task with that task's exact request embedded in the visible instruction.

A real Datapoint sandbox round trip remains pending until `DATAPOINT_KEY` is available in a suitable execution environment. The client code hard-refuses `prod` and `all` job creation in this sandbox slice.

## Datapoint grant

Human annotation for the planned core study is supported by a Datapoint Data Grant. **No Datapoint production annotation or paid Datapoint pilot is part of the current calibration stage.**
'''
          replace_once('README.md', datapoint_heading, datapoint_replacement)

          design_old = '''Pairwise payload:

- task type `comparison`;
- exact benchmark instruction-faithfulness/preference wording;
- two image candidates per datapoint;
- original user instruction in `context` for provenance, even though the comparison job-level question is the visible prompt;
- stable Thrumely metadata retained outside Datapoint payloads so result rows can be rejoined by `datapoint_index`.
'''
          design_new = '''Pairwise payload:

- task type `comparison`;
- one Datapoint comparison job per benchmark task;
- exact original user instruction embedded in that job's visible `instruction`;
- all predeclared A/B pairs for the task batched as datapoints within that job;
- two image candidates per datapoint;
- stable Thrumely metadata retained outside Datapoint payloads so result rows can be rejoined by `datapoint_index`.

This avoids relying on undocumented per-datapoint context rendering for comparison. Datapoint explicitly documents `{context}` substitution for rating, but the comparison contract guarantees only the job-level instruction is shown.
'''
          replace_once('docs/superpowers/specs/2026-09-01-datapoint-sandbox-design.md', design_old, design_new)

          design_real_old = '''### 5. Real sandbox command

The same module exposes an opt-in CLI path that requires `DATAPOINT_KEY` and refuses to run if the key is absent. It may upload supplied local synthetic image fixtures and submit only `serving_environment: sandbox` jobs.

No real job is executed in normal CI.
'''
          design_real_new = '''### 5. Real sandbox execution gate

This zero-cost slice intentionally enables only the credential-free `--offline` contract. A real Datapoint sandbox round trip is the next measurement check once `DATAPOINT_KEY` is available in a suitable execution environment. That future path must reuse the same sandbox-only client boundary and may not expose a `prod` or `all` switch.

No real job is executed in normal CI.
'''
          replace_once('docs/superpowers/specs/2026-09-01-datapoint-sandbox-design.md', design_real_old, design_real_new)

          plan_old = '- Produces: `build_pairwise_sandbox_job(name, pairs, max_responses_per_datapoint=5) -> dict[str, object]`'
          plan_new = '- Produces: `build_pairwise_sandbox_job(name, user_instruction, pairs, max_responses_per_datapoint=5) -> dict[str, object]`'
          replace_once('docs/superpowers/plans/2026-09-01-datapoint-sandbox.md', plan_old, plan_new)

          plan_test_old = '- [ ] **Step 1: Write failing tests** asserting pairwise uses `comparison`, contains exactly two image candidates, emits `serving_environment == "sandbox"`, and rating uses `[1,2,3,4,5]` with `{context}` in the instruction.'
          plan_test_new = '- [ ] **Step 1: Write failing tests** asserting pairwise uses `comparison`, embeds the exact benchmark task request in the job-level instruction, contains exactly two image candidates per datapoint, emits `serving_environment == "sandbox"`, and rating uses `[1,2,3,4,5]` with `{context}` in the instruction.'
          replace_once('docs/superpowers/plans/2026-09-01-datapoint-sandbox.md', plan_test_old, plan_test_new)
          PY

          rm .github/workflows/patch-datapoint-methodology.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: align Datapoint measurement protocol'
          git push origin HEAD:feat/datapoint-sandbox-plumbing
