name: Datapoint live sandbox smoke

on:
  push:
    branches:
      - ops/datapoint-live-sandbox
    paths:
      - .datapoint-live-trigger

permissions:
  contents: read

jobs:
  live-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATAPOINT_KEY: ${{ secrets.DATAPOINT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Thrumely
        run: python -m pip install -e .

      - name: Run authenticated zero-credit sandbox round trip
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATAPOINT_KEY:-}" ]; then
            echo "DATAPOINT_KEY repository secret is missing; no Datapoint request was made."
            exit 2
          fi
          python - <<'PY'
          import json
          import os
          import tempfile
          import time
          from pathlib import Path

          from thrumely.datapoint_client import DatapointClient
          from thrumely.datapoint_protocol import build_pairwise_sandbox_job, build_rating_sandbox_job

          key = os.environ["DATAPOINT_KEY"]
          run_id = os.environ.get("GITHUB_RUN_ID", str(int(time.time())))
          client = DatapointClient(key)

          svg_a = '''<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" fill="white"/><rect x="156" y="156" width="200" height="200" rx="12" fill="#d22"/></svg>'''
          svg_b = '''<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" fill="white"/><circle cx="256" cy="256" r="100" fill="#d22"/></svg>'''

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              a = root / "thrumely-sandbox-a.svg"
              b = root / "thrumely-sandbox-b.svg"
              a.write_text(svg_a, encoding="utf-8")
              b.write_text(svg_b, encoding="utf-8")

              media_a = client.upload_media(a)
              media_b = client.upload_media(b)

              prompt = "Create a red square centered on a white canvas."
              pair_payload = build_pairwise_sandbox_job(
                  f"thrumely-live-sandbox-pairwise-{run_id}",
                  prompt,
                  [{"candidate_a": media_a["media_ref"], "candidate_b": media_b["media_ref"]}],
              )
              rating_payload = build_rating_sandbox_job(
                  f"thrumely-live-sandbox-rating-{run_id}",
                  [{"context": prompt, "subject": media_a["media_ref"]}],
              )

              pair_create = client.create_sandbox_job(pair_payload)
              rating_create = client.create_sandbox_job(rating_payload)

              for created in (pair_create, rating_create):
                  if created.get("estimated_cost_credits") not in (0, None):
                      raise RuntimeError("sandbox creation unexpectedly reported non-zero estimated credits")

              def wait_ready(job_id: str):
                  last = None
                  for _ in range(30):
                      last = client.get_job(job_id)
                      if last.get("status") != "processing":
                          return last
                      time.sleep(2)
                  return last

              pair_id = str(pair_create["job_id"])
              rating_id = str(rating_create["job_id"])
              pair_status = wait_ready(pair_id)
              rating_status = wait_ready(rating_id)

              def preview_count(job_id: str) -> int:
                  payload = client.get_preview(job_id)
                  data = payload.get("data") if isinstance(payload, dict) else None
                  tasks = data.get("tasks") if isinstance(data, dict) else None
                  return len(tasks) if isinstance(tasks, list) else 0

              pair_preview = preview_count(pair_id)
              rating_preview = preview_count(rating_id)

              if pair_status.get("serving_environment") != "sandbox" or rating_status.get("serving_environment") != "sandbox":
                  raise RuntimeError("Datapoint returned a non-sandbox serving environment")
              if pair_status.get("cost_credits") not in (0, None) or rating_status.get("cost_credits") not in (0, None):
                  raise RuntimeError("sandbox status unexpectedly reported non-zero credit cost")
              if pair_preview < 1 or rating_preview < 1:
                  raise RuntimeError("Datapoint preview did not render the expected sandbox task")

              summary = {
                  "mode": "LIVE_DATAPOINT_SANDBOX",
                  "pairwise": {
                      "job_id": pair_id,
                      "status": pair_status.get("status"),
                      "serving_environment": pair_status.get("serving_environment"),
                      "cost_credits": pair_status.get("cost_credits"),
                      "preview_tasks": pair_preview,
                  },
                  "rating": {
                      "job_id": rating_id,
                      "status": rating_status.get("status"),
                      "serving_environment": rating_status.get("serving_environment"),
                      "cost_credits": rating_status.get("cost_credits"),
                      "preview_tasks": rating_preview,
                  },
                  "uploaded_media": 2,
                  "credits_spent": 0,
              }
              print(json.dumps(summary, indent=2, sort_keys=True))
          PY
