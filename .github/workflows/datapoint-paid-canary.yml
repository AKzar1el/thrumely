name: Datapoint balance read

on:
  push:
    branches:
      - feat/datapoint-paid-canary
    paths:
      - .datapoint-paid-canary-trigger

permissions:
  contents: read

jobs:
  balance-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATAPOINT_KEY: ${{ secrets.DATAPOINT_KEY }}
    steps:
      - name: Read current Datapoint balance
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATAPOINT_KEY:-}" ]; then
            echo "DATAPOINT_KEY repository secret is missing; no Datapoint request was made."
            exit 2
          fi
          curl --fail-with-body --silent --show-error \
            -H "X-API-Key: ${DATAPOINT_KEY}" \
            -H "Accept: application/json" \
            https://api.trydatapoint.com/data-labelling/v1/billing/balance
          echo
