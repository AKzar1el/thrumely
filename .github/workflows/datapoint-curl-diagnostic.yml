name: Datapoint curl diagnostic

on:
  push:
    branches:
      - ops/datapoint-live-sandbox
    paths:
      - .datapoint-curl-trigger

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATAPOINT_KEY: ${{ secrets.DATAPOINT_KEY }}
    steps:
      - name: Read-only Datapoint jobs request with curl
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATAPOINT_KEY:-}" ]; then
            echo "DATAPOINT_KEY repository secret is missing"
            exit 2
          fi
          code="$(curl --silent --show-error --output /tmp/datapoint.json --write-out '%{http_code}' \
            --header "X-API-Key: ${DATAPOINT_KEY}" \
            --header 'Accept: application/json' \
            'https://api.trydatapoint.com/data-labelling/v1/jobs')"
          echo "Datapoint HTTP status: ${code}"
          if [ "${code}" != "200" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/datapoint.json')
          try:
              value = json.loads(p.read_text())
          except Exception:
              value = {'error': 'non-json response'}
          safe = {k: value.get(k) for k in ('status','title','detail','error_code','error_name') if isinstance(value, dict) and k in value}
          print(json.dumps(safe, sort_keys=True))
          PY
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/datapoint.json').read_text())
          jobs = value.get('jobs') if isinstance(value, dict) else None
          print(json.dumps({'authenticated': True, 'jobs_list_shape': isinstance(jobs, list), 'jobs_count': len(jobs) if isinstance(jobs, list) else None}, sort_keys=True))
          PY
