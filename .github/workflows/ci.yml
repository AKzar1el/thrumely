name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m thrumely.datapoint_sandbox --offline
      - run: python -m thrumely.pilot_synthetic
      - run: python -m thrumely.experiment_synthetic
      - run: python -m thrumely.freeze_preflight --synthetic --output .ci-freeze-preflight
      - run: python -m thrumely.validate_candidates candidates/tasks-v0.1.jsonl
      - run: python -m thrumely.power --tasks 100 --effect 0.20 --simulations 2000 --seed 20260901
      - run: python -m thrumely.validate_normalization
      - run: python -m thrumely.offline --output .ci-offline
