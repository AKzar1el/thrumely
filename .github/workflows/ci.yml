name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m thrumely.datapoint_sandbox --offline
      - run: python -m thrumely.validate_candidates candidates/tasks-v0.1.jsonl
      - run: python -m thrumely.power --tasks 100 --effect 0.20 --simulations 2000 --seed 20260901
      - run: python -m thrumely.validate_normalization
      - run: python -m thrumely.offline --output .ci-offline
